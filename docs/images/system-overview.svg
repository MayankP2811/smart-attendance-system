<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Smart Attendance System overview</title>
  <desc>In each classroom, a fingerprint sensor and LCD at the door identify the lecture, a wall camera photographs the class at random moments, and a Raspberry Pi matches the faces and writes attendance to MySQL. A PHP website reads the same database for students and faculty.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b82"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b2a4a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#f6f6f9"/>

  <!-- Classroom station -->
  <g filter="url(#sh)"><rect x="30" y="40" width="430" height="480" rx="22" fill="#fff"/></g>
  <text x="58" y="82" font-size="13" font-weight="700" fill="#1fb57d" letter-spacing="1.5">IN EVERY CLASSROOM</text>
  <text x="58" y="110" font-size="22" font-weight="700" fill="#2d3250">Attendance station</text>

  <g transform="translate(58 140)">
    <rect width="170" height="110" rx="14" fill="#eef8f3"/>
    <g transform="translate(20 22)" stroke="#1fb57d" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M14 46c0-14 6-22 13-22s13 8 13 22"/><path d="M6 44c0-20 9-30 21-30s21 10 21 30"/><path d="M21 52c0-10 2-16 6-16s6 6 6 18"/>
    </g>
    <text x="78" y="44" font-size="15" font-weight="700" fill="#2d3250">Fingerprint</text>
    <text x="78" y="64" font-size="12" fill="#5b6b82">outside the door:</text>
    <text x="78" y="80" font-size="12" fill="#5b6b82">faculty → subject</text>
  </g>
  <g transform="translate(262 140)">
    <rect width="170" height="110" rx="14" fill="#eef1fd"/>
    <rect x="18" y="30" width="48" height="34" rx="7" fill="#2d3250"/><circle cx="42" cy="47" r="11" fill="#7380ec"/><circle cx="42" cy="47" r="4.5" fill="#eef1fd"/>
    <text x="78" y="44" font-size="15" font-weight="700" fill="#2d3250">Camera</text>
    <text x="78" y="64" font-size="12" fill="#5b6b82">on the wall,</text>
    <text x="78" y="80" font-size="12" fill="#5b6b82">random photos</text>
  </g>
  <g transform="translate(58 270)">
    <rect width="374" height="120" rx="14" fill="#2d3250"/>
    <text x="22" y="34" font-size="15" font-weight="700" fill="#fff">Raspberry Pi 4B · Python</text>
    <text x="22" y="58" font-size="12.5" fill="#c9d3e8">HOG face detection + 128-number face embeddings</text>
    <text x="22" y="78" font-size="12.5" fill="#c9d3e8">match each face to a student's roll number</text>
    <text x="22" y="98" font-size="12.5" fill="#c9d3e8">→ present if seen in ≥ 60 % of the photos</text>
  </g>
  <g transform="translate(58 410)">
    <rect width="374" height="84" rx="14" fill="#eef8f3"/>
    <rect x="18" y="16" width="190" height="52" rx="6" fill="#1f6b3d"/>
    <text x="30" y="38" font-family="Menlo, Consolas, monospace" font-size="14" fill="#c8ffd8">Lec: maths</text>
    <text x="30" y="58" font-family="Menlo, Consolas, monospace" font-size="14" fill="#c8ffd8">Ends in 00:52:10</text>
    <text x="224" y="38" font-size="15" font-weight="700" fill="#2d3250">16×2 LCD</text>
    <text x="224" y="58" font-size="12" fill="#5b6b82">lecture + countdown</text>
  </g>
  <path d="M143 250v20M347 250v20" stroke="#5b6b82" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Database -->
  <path d="M462 330H560" stroke="#5b6b82" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="472" y="318" font-size="12" fill="#5b6b82">attendance</text>
  <g filter="url(#sh)" transform="translate(568 200)">
    <rect width="190" height="250" rx="22" fill="#fff"/>
    <g transform="translate(55 34)">
      <ellipse cx="40" cy="12" rx="40" ry="12" fill="#7380ec"/>
      <path d="M0 12v56c0 7 18 12 40 12s40-5 40-12V12" fill="#8b96f0"/>
      <ellipse cx="40" cy="40" rx="40" ry="12" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/>
    </g>
    <text x="95" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#2d3250">MySQL</text>
    <text x="95" y="174" text-anchor="middle" font-size="12" fill="#5b6b82">users · subjects</text>
    <text x="95" y="192" text-anchor="middle" font-size="12" fill="#5b6b82">lectures · attendance</text>
    <text x="95" y="210" text-anchor="middle" font-size="12" fill="#5b6b82">messages · announcements</text>
  </g>

  <!-- Website -->
  <path d="M760 330H850" stroke="#5b6b82" stroke-width="2.5" marker-end="url(#arr)"/>
  <g filter="url(#sh)"><rect x="858" y="40" width="312" height="480" rx="22" fill="#fff"/></g>
  <text x="884" y="82" font-size="13" font-weight="700" fill="#7380ec" letter-spacing="1.5">IN THE BROWSER</text>
  <text x="884" y="110" font-size="22" font-weight="700" fill="#2d3250">PHP website</text>
  <g transform="translate(884 136)">
    <rect width="260" height="168" rx="14" fill="#eef8f3"/>
    <text x="18" y="32" font-size="15" font-weight="700" fill="#2d3250">Students</text>
    <g font-size="12.5" fill="#3c4a5f">
      <text x="18" y="60">• attendance in every subject</text>
      <text x="18" y="84">• analytics with a warning</text>
      <text x="18" y="108">• leave application to faculty</text>
      <text x="18" y="132">• alerts / announcements</text>
    </g>
  </g>
  <g transform="translate(884 322)">
    <rect width="260" height="168" rx="14" fill="#eef1fd"/>
    <text x="18" y="32" font-size="15" font-weight="700" fill="#2d3250">Faculty</text>
    <g font-size="12.5" fill="#3c4a5f">
      <text x="18" y="60">• whole-class attendance record</text>
      <text x="18" y="84">• correct a status / mark leave</text>
      <text x="18" y="108">• announcements, leave requests</text>
      <text x="18" y="132">• download CSV / Excel</text>
    </g>
  </g>
</svg>
